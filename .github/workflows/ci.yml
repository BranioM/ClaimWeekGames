name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: claimweekgames
          POSTGRES_PASSWORD: claimweekgames
          POSTGRES_DB: claimweekgames
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U claimweekgames -d claimweekgames"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://claimweekgames:claimweekgames@localhost:5432/claimweekgames?schema=public
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup npm
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        working-directory: apps/api
        run: npx prisma validate

      - name: Apply database migrations
        working-directory: apps/api
        run: npx prisma migrate deploy

      - name: Lint API
        run: npm run lint --workspace api

      - name: Test API
        run: npm test --workspace api

      - name: Test API e2e
        run: npm run test:e2e --workspace api

      - name: Build workspace
        run: npm run build
