[project]
name = "claimweekgames"
version = "0.1.0"
description = "Secure foundation for ClaimWeekGames backend services."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
  "black>=25.1.0",
  "httpx>=0.28.0",
  "mypy>=1.16.0",
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "RUF"]
ignore = [
  "S101"
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
files = ["backend", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
